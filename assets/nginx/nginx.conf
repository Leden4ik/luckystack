# Использование: MySQL прокси, DNS (UDP), SSH форвардинг портов, IMAP/SMTP прокси и т.д.
# Requires: stream_module support (usually built by default)
#
# Add your stream server blocks in separate files in /etc/nginx/stream.d/
# Examples:
#   /etc/nginx/stream.d/mysql.conf — MySQL proxy to backend servers
#   /etc/nginx/stream.d/dns.conf — DNS proxy (UDP 53)
#   /etc/nginx/stream.d/ssh.conf — SSH multiplexing (TCP 22)
