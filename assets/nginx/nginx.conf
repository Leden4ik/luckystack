user nginx;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
pcre_jit on;

# --- HTTP/3 / QUIC — main context directive (requires HTTP3=y) ---
# NOTE: directive below must be in the MAIN context, NOT inside http block
# NOTE: директива ниже должна быть в MAIN контексте, НЕ внутри http блока
# quic_bpf on;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # --- MIME Types / MIME-типы ---
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging Formats / Форматы логирования ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    log_format combined_ssl '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for" '
                             '$ssl_protocol/$ssl_cipher';

    # --- IP Anonymization (GDPR Compliance) / Анонимизация IP (GDPR Соответствие) ---
    # Remove last octet from IPv4 and lower bits from IPv6 to comply with privacy regulations
    # Удаляет последний октет из IPv4 и младшие биты IPv6 для соответствия правилам приватности
    map $remote_addr $ip_anonymized {
        default "0.0.0.0";
        "~^(?P<ip>\d+\.\d+\.\d+)\.\d+$" "${ip}.0";   # IPv4: anonymize /24 / анонимизировать /24
        # IPv6: keep first two hextets (~/32), zero the rest. Avoids the named-group-in-{n}
        # capture bug; handles both full and compressed (2001:db8::1) addresses.
        # IPv6: оставить первые два хекстета (~/32), остальное обнулить.
        "~(?P<ip>[^:]+:[^:]+):" "${ip}::";
    }

    # Anonymized log format for privacy-friendly logging
    # Анонимизированный формат логов для логирования с учётом приватности
    log_format anonymized '$ip_anonymized - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    # Real-IP log for CrowdSec/fail2ban ONLY (combined format with real $remote_addr).
    # The public access.log stays anonymized (GDPR); IPS tools need the real client IP to
    # ban the actual attacker, not the masked .0 network address. Keep this log short-lived
    # (logrotate) — it is an internal security log, not for analytics.
    # Реальный IP-лог ТОЛЬКО для CrowdSec/fail2ban: публичный лог остаётся маскированным,
    # а инструментам защиты нужен настоящий IP клиента (иначе банят сетевой .0, а не атакующего).
    log_format crowdsec_realip '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log anonymized buffer=32k flush=5s;
    access_log /var/log/nginx/crowdsec.log crowdsec_realip buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --- Rate Limiting Zones (DDoS/Abuse Protection) / Зоны Rate Limiting (Защита от DDoS) ---
    # General API: 10 requests per second
    # Общий API: 10 запросов в секунду
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Login forms: 5 requests per minute (very strict for brute-force protection)
    # Форм логина: 5 запросов в минуту (очень строго для защиты от brute-force)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Bot detection: 1 request per second (strict rate for suspicious user agents)
    # Детектирование ботов: 1 запрос в секунду (строгий лимит для подозрительных User-Agent)
    limit_req_zone $http_user_agent zone=bot:10m rate=1r/s;

    # Connection limiting: max 50 concurrent connections per IP
    # Ограничение соединений: макс 50 одновременных соединений на IP
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_conn connections 50;

    # Usage in vhost location blocks (burst and nodelay go here, not in zone definition above):
    #   limit_req zone=general burst=20 nodelay;   # 10 req/s + burst buffer of 20
    #   limit_req zone=login burst=3 nodelay;      # brute-force protection
    #   limit_req zone=bot nodelay;                # bot throttle
    #   limit_conn connections 50;                 # already applied globally above

    # --- Core Settings (Базовые Параметры) ---
    # Asynchronous I/O for file operations — reduces CPU blocking during disk I/O
    # Асинхронные операции ввода-вывода — снижает нагрузку на CPU во время дисковых операций
    aio threads;
    aio_write on;

    # Efficient file transmission — uses sendfile() syscall for zero-copy transfers
    # Эффективная передача файлов — использует sendfile() для трансмиссии без копирования
    sendfile on;
    tcp_nopush on;        # Groups packets before sending (improves efficiency)
    tcp_nodelay on;       # Sends small packets immediately (reduces latency for interactive apps)
    server_tokens off;    # Don't advertise nginx version (security via obscurity)

    # Connection timeout — closes idle keep-alive connections after 65s to free resources
    # Таймаут соединения — закрывает неиспользуемые keep-alive соединения после 65 сек
    keepalive_timeout 65;

    # Hash table sizes for host names and mime types
    # Размеры хеш-таблиц для имен хостов и MIME-типов
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;

    # Maximum request body size — prevents memory exhaustion from huge POST/uploads
    # Максимальный размер тела запроса — предотвращает исчерпание памяти больших загрузок
    client_max_body_size 256m;

    # --- Open File Cache (Кэш Открытых Файлов) ---
    # Caches file descriptors, sizes, and modification times to avoid repeated syscalls
    # Кэширует файловые дескрипторы, размеры и время изменения для снижения syscall
    # max=10000 — cache up to 10,000 files
    # inactive=30s — invalidate cache entry after 30 seconds of non-access
    # valid=60s — check if file still valid every 60 seconds
    # min_uses=2 — cache only files used at least 2 times (reduces cache pollution)
    # errors=on — cache "file not found" errors (404) for performance
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- FastCGI & Proxy Buffers (Буферы FastCGI и Proxy) ---
    # Buffers for FastCGI responses (e.g., PHP-FPM) — prevents disk writes for small responses
    # Буферы для ответов FastCGI (например PHP-FPM) — избегает записи на диск для малых ответов
    fastcgi_buffers 16 16k;      # 16 buffers of 16KB each = 256KB total
    fastcgi_buffer_size 32k;     # Size of first buffer (for response headers)

    # Buffers for proxy responses — larger buffers reduce upstream latency impact
    # Буферы для ответов от upstream серверов — больше буфер = меньше задержка
    proxy_buffer_size 128k;      # Size of first buffer (for headers)
    proxy_buffers 4 256k;        # 4 buffers of 256KB each = 1MB total
    proxy_busy_buffers_size 256k; # Max size of buffered data sent to client at once

    # --- Gzip Compression (Сжатие Gzip) ---
    # Compresses responses to reduce bandwidth — most effective for text content (CSS, JS, JSON)
    # Сжимает ответы для уменьшения трафика — эффективно для текстового контента (CSS, JS, JSON)
    gzip on;
    gzip_vary on;               # Add Vary: Accept-Encoding header (important for CDN/caching)
    gzip_comp_level 6;          # Compression level 1-9 (higher=better, slower; 6=good balance)
    gzip_proxied any;           # Compress responses from upstream proxy servers
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_static on;             # Use pre-compressed .gz files if available (created during build)

    # --- HTTP/3 / QUIC Support (Поддержка HTTP/3 / QUIC) ---
    # Next-generation protocol over UDP — reduces latency and improves mobile experience
    # Следующее поколение протокола поверх UDP — снижает задержку на мобильных устройствах
    # Requires: nginx compiled with HTTP3=y flag (--with-http_v3_module)
    # Требует: nginx скомпилирован с флагом HTTP3=y (--with-http_v3_module)
    #
    # To enable in your server block (after uncommenting below):
    #   listen 443 quic reuseport;
    #   listen [::]:443 quic reuseport ipv6only=on;
    #   add_header alt-svc 'h3=":443"; ma=86400' always;
    #
    # quic_gso on;  # Generic Segmentation Offload — improves throughput for bulk transfers
    # quic_retry on;  # QUIC Address Validation — anti-amplification/spoofing hardening (+1 RTT on first connect)

    # --- Brotli Compression (Сжатие Brotli) ---
    # Modern compression algorithm — better compression ratio than gzip, especially for text
    # Современный алгоритм сжатия — лучше чем gzip, особенно для текста
    # Requires: nginx compiled with BROTLI=y flag (--with-brotli)
    # Requires: nginx compiled with BROTLI=y flag (скомпилирован с --with-brotli)
    # All modern browsers support Brotli (98%+ coverage as of 2024)
    #
    # Includes modern MIME types:
    # - text/markdown — for documentation
    # - application/wasm — WebAssembly modules
    # - application/vnd.api+json — JSON:API specification
    # - image formats: webp, avif, heic — modern image codecs
    #
    # brotli on;
    # brotli_comp_level 6;        # 1-11, higher=better compression but slower
    # brotli_static on;           # Use pre-compressed .br files if available
    # brotli_types text/plain text/css text/xml text/markdown text/cache-manifest text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy application/atom+xml application/javascript application/json application/ld+json application/vnd.api+json application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml application/wasm application/x-protobuffer image/bmp image/svg+xml image/x-icon font/opentype font/woff font/woff2;

    # --- Zstd Compression (Сжатие Zstd) ---
    # Modern compression from Meta — combines speed with compression ratio better than gzip
    # Современный алгоритм от Meta — быстрее и лучше сжимает чем gzip
    # Requires: nginx compiled with ZSTD=y flag (--with-zstd)
    # Requires: nginx compiled with ZSTD=y flag (скомпилирован с --with-zstd)
    # Browser support: ~85% (modern browsers only, less common than Brotli)
    # Recommended for APIs and JSON responses where speed matters more than size
    # Рекомендуется для APIs и JSON где скорость важнее размера ответа
    #
    # zstd on;
    # zstd_comp_level 3;          # 1-22, default 3 is good balance (lower=faster)
    # zstd_static on;             # Use pre-compressed .zst files if available
    # zstd_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --- GeoIP2 Database Integration (Интеграция GeoIP2) ---
    # Location-based access control — geo-block regions, log country/city data
    # Контроль доступа по геолокации — блокировка регионов, логирование страны/города
    # Requires: nginx compiled with GEOIP=y flag (--with-geoip2)
    # Requires: nginx compiled with GEOIP=y flag (скомпилирован с --with-geoip2)
    # Databases: Download MaxMind GeoLite2-Country.mmdb and GeoLite2-City.mmdb
    # Put in: /opt/geoip/ directory (create if not exists)
    # Auto-updated via the geoipupdate systemd timer (configured by nginx-autoinstall.sh)
    #
    # Usage examples:
    #   - Block specific countries in server block: if ($geoip2_data_country_code ~ "CN|RU") { return 403; }
    #   - Log access by country: custom log format with $geoip2_data_country_code, $geoip2_data_city_name
    #   - Redirect by region: if ($geoip2_data_country_code = "US") { rewrite ^(.*)$ https://us.example.com$1; }
    #
    # geoip2 /opt/geoip/GeoLite2-Country.mmdb {
    #     $geoip2_data_country_code    default=XX      source=$remote_addr country iso_code;
    #     $geoip2_data_country_name    default=Unknown source=$remote_addr country names en;
    # }
    # geoip2 /opt/geoip/GeoLite2-City.mmdb {
    #     $geoip2_data_city_name           default=Unknown source=$remote_addr city names en;
    #     $geoip2_data_location_latitude   default=0       source=$remote_addr location latitude;
    #     $geoip2_data_location_longitude  default=0       source=$remote_addr location longitude;
    # }

    # GeoIP log format — uncomment geoip2 blocks above first (requires GEOIP=y)
    # Use in vhost: access_log /var/log/nginx/geo.log geoip;
    # Использование: access_log /var/log/nginx/geo.log geoip;
    # log_format geoip '$remote_addr - $remote_user [$time_local] '
    #                  '"$request" $status $body_bytes_sent '
    #                  '"$http_referer" "$http_user_agent" '
    #                  'Country: $geoip2_data_country_name ($geoip2_data_country_code) '
    #                  'City: $geoip2_data_city_name '
    #                  'Lat/Lon: $geoip2_data_location_latitude,$geoip2_data_location_longitude';

    # --- GeoIP2 Country Blocking Maps (Карты блокировки по стране) ---
    # map directives MUST be in http context — cannot be inside server {} blocks.
    # map директивы ДОЛЖНЫ быть в http контексте — нельзя внутри server {} блоков.
    # After enabling, use $blocked_country or $allowed_country in your server blocks.
    # После включения используйте $blocked_country или $allowed_country в server блоках.
    # See: /etc/nginx/snippets/geoip-blocking.conf for usage examples.
    # Смотрите: /etc/nginx/snippets/geoip-blocking.conf для примеров использования.
    #
    # BLACKLIST — block specific countries, allow everyone else:
    # ЧЁРНЫЙ СПИСОК — блокировать конкретные страны, разрешить остальных:
    # map $geoip2_data_country_code $blocked_country {
    #     default          0;   # allow everyone else
    #     CN               1;   # China / Китай
    #     KP               1;   # North Korea / Северная Корея
    #     IR               1;   # Iran / Иран
    #     # RU             1;   # Russia / Россия
    #     # SY             1;   # Syria / Сирия
    #     # BY             1;   # Belarus / Беларусь
    # }
    #
    # WHITELIST — allow only specific countries, block everyone else:
    # БЕЛЫЙ СПИСОК — разрешить только конкретные страны, блокировать остальных:
    # map $geoip2_data_country_code $allowed_country {
    #     default          0;   # block everyone else
    #     RU               1;   # Russia / Россия
    #     BY               1;   # Belarus / Беларусь
    #     UA               1;   # Ukraine / Украина
    #     KZ               1;   # Kazakhstan / Казахстан
    #     # US 1; GB 1; DE 1; FR 1; JP 1;
    # }
    #
    # WHITELIST WITH IP OVERRIDE — block country but allow trusted IPs:
    # БЕЛЫЙ СПИСОК С ДОВЕРЕННЫМИ IP — блокировать страну но пропускать известные IP:
    # geo $trusted_ip {
    #     default          0;
    #     1.2.3.4          1;   # your trusted IP / ваш доверенный IP
    #     10.0.0.0/8       1;   # internal network / внутренняя сеть
    # }
    # map "$trusted_ip:$geoip2_data_country_code" $should_block {
    #     default          0;
    #     "~^0:(CN|KP|IR)"  1;  # not trusted AND blocked country
    # }

    # --- VTS - Vhost Traffic Status Module (Модуль Статистики VTS) ---
    # Real-time traffic statistics — monitors requests/bytes per vhost and location
    # Статистика трафика в реальном времени — мониторит запросы/байты на vhost
    # Requires: nginx compiled with VTS=y flag (--with-http_vhost_traffic_status_module)
    # Requires: nginx compiled with VTS=y flag (скомпилирован с --with-http_vhost_traffic_status_module)
    #
    # Features:
    #   - Real-time monitoring of requests, bytes sent/received, latency per vhost/location
    #   - Web dashboard accessible at: http://your-server/vts/status
    #   - JSON API for integration with monitoring systems (Prometheus, Grafana, etc.)
    #   - Minimal performance overhead (~1% CPU)
    #
    # Usage: Access http://nginx-server:80/vts/status for HTML dashboard
    #
    # vhost_traffic_status_zone;

    # --- ModSecurity - Web Application Firewall (Модуль ModSecurity - WAF) ---
    # Application-layer firewall — protects against OWASP Top 10, SQL injection, XSS, etc.
    # Файрвол уровня приложения — защита от OWASP Top 10, SQL injection, XSS и т.д.
    # Requires: nginx compiled with MODSEC=y flag (--with-modsecurity)
    # Requires: nginx compiled with MODSEC=y flag (скомпилирован с --with-modsecurity)
    # Configuration: OWASP Core Rule Set (CRS) provides ready-to-use rules
    #
    # Enable ModSecurity globally (applies to all vhosts):
    # OR enable per-vhost for specific applications (more common approach)
    #
    # Rules file location: /etc/nginx/modsec/main.conf
    # Should contain:
    #   - Include modsecurity.conf (engine settings)
    #   - Include OWASP CRS (e.g., coreruleset-3.x.conf)
    #   - Custom rules for your applications
    #
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # --- SSL/TLS Configuration (Настройка SSL/TLS) ---
    # Protocol versions and cipher suites for HTTPS connections
    # Версии протокола и наборы шифров для HTTPS соединений
    #
    # Supported protocols: TLSv1.2 (2008), TLSv1.3 (2018, modern, faster)
    # TLSv1.2 provides backward compatibility with older clients
    # TLSv1.3 is required for HTTP/3 (QUIC) and provides better performance
    #
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cipher suites: Modern, strong ciphers supporting Forward Secrecy (ECDHE/DHE)
    # Наборы шифров: Современные, сильные шифры с Perfect Forward Secrecy (ECDHE/DHE)
    # Prioritized order:
    #   1. ECDHE-* (elliptic curve): Fastest, Forward Secrecy, supports TLS 1.3
    #   2. CHACHA20-POLY1305: Mobile-friendly (some CPUs faster than AES)
    #   3. DHE-* (Diffie-Hellman): Fallback, all clients supported
    # Rating: A+ on SSL Labs, 98%+ browser compatibility
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;  # Client chooses cipher (better for modern TLS 1.3 handshake)

    # Session caching — reuse TLS session keys to speed up reconnections (~3-5x faster)
    # Кэширование сессий — переиспользование ключей для быстрых переподключений
    ssl_session_cache shared:SSL:10m;  # Shared across all worker processes, 10MB size
    ssl_session_timeout 1d;             # Session valid for 1 day
    ssl_session_tickets off;            # Disable resumption tickets (more secure, slight perf cost)

    # --- OCSP Stapling — ОТКЛЮЧЕНО / DISABLED (устарел в 2025+) ---
    # Let's Encrypt убрал OCSP-ссылку из сертификатов (переход на CRL + короткоживущие
    # сертификаты), а самоподписанные сертификаты (панель ISPConfig) цепочки не имеют.
    # Поэтому ssl_stapling невозможен и nginx пишет предупреждения:
    #   "ssl_stapling ignored, no OCSP responder URL in the certificate"   (LE)
    #   "ssl_stapling ignored, issuer certificate not found"                (self-signed)
    # OCSP индустрия сворачивает — оставляем выключенным, ничего не теряется.
    # LE dropped OCSP from certs in 2025; self-signed certs have no chain → stapling
    # cannot work. Keep disabled to avoid the warnings.
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # resolver требовался только для OCSP. Раскомментируйте, ТОЛЬКО если используете
    # динамический DNS-резолвинг (переменные в proxy_pass / upstream resolve).
    # resolver only served OCSP — uncomment only if you use dynamic DNS resolution.
    # resolver 1.1.1.1 1.0.0.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # --- HTTP Security Headers (Заголовки Безопасности HTTP) ---
    # Requires: headers-more-nginx-module (compile with HEADERMOD=y)
    # Requires: headers-more-nginx-module (скомпилирован с HEADERMOD=y)
    # These headers prevent common web vulnerabilities and help browsers enforce security policies
    # Эти заголовки предотвращают распространенные уязвимости и помогают браузерам
    #
    # Include this file in your vhosts:
    #   include snippets/security-headers.conf;
    #
    # Then uncomment desired headers (all currently commented for compatibility with ISPConfig)

    # Remove server identification (nginx version, PHP version, etc.) — security via obscurity
    # Удалить идентификацию сервера (версия nginx, PHP и т.д.) — безопасность через скрытие
    # more_clear_headers 'X-Powered-By' 'Server' 'X-AspNet-Version' 'X-Runtime-Version';

    # X-Content-Type-Options: nosniff — prevent MIME type sniffing attacks
    # Prevent browser from executing CSS/fonts as scripts, images as HTML
    # Предотвращает браузер выполнять CSS/шрифты как скрипты, изображения как HTML
    # more_set_headers 'X-Content-Type-Options: nosniff' always;

    # X-Frame-Options: SAMEORIGIN — clickjacking protection
    # Prevent page from being embedded in iframe on external sites
    # Предотвращает встраивание страницы в iframe на внешних сайтах
    # more_set_headers 'X-Frame-Options: SAMEORIGIN' always;

    # X-XSS-Protection и Expect-CT сознательно НЕ ставим: браузеры их больше не поддерживают,
    # а X-XSS-Protection в старых браузерах сам давал утечку данных (XS-Leak).

    # Referrer-Policy — control how much referrer info is sent in requests
    # strict-origin-when-cross-origin: send origin only for cross-site requests (privacy)
    # more_set_headers 'Referrer-Policy: strict-origin-when-cross-origin' always;

    # Permissions-Policy (formerly Feature-Policy) — restrict dangerous APIs
    # Block: accelerometer, camera, geolocation, microphone, payment, USB
    # Blocks any iframe from accessing these features even if they request them
    # more_set_headers 'Permissions-Policy: accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()' always;

    # HSTS — Strict-Transport-Security (HTTPS enforcement) ⚠️ WARNING ⚠️
    # ONLY enable after HTTPS works perfectly. Incorrect SSL = locked out for 1 YEAR!
    # Start with max-age=300 (5 min) for testing, then increase to 31536000 (1 year)
    # ⚠️ ОСТОРОЖНО: Неправильный SSL = заблокирован на 1 ГОД!
    # Начните с max-age=300 для тестирования, потом увеличьте до 31536000
    # [opt-in] more_set_headers 'Strict-Transport-Security: max-age=31536000; includeSubDomains; preload' always;

    # Content-Security-Policy (CSP) — prevent inline scripts and restrict resource loading
    # ❌ DO NOT use global restrictive CSP!
    # ✅ DO customize per vhost/application!
    # Examples:
    #   Basic: only self
    #   Example: more_set_headers 'Content-Security-Policy: default-src ''self''; img-src ''self'' data: https:;' always;
    #
    #   With CDN:
    #   Example: more_set_headers 'Content-Security-Policy: default-src ''self''; script-src ''self'' cdn.trusted.com; style-src ''self'' ''unsafe-inline'';' always;
    #
    #   For WordPress (requires unsafe-inline):
    #   Example: more_set_headers 'Content-Security-Policy: default-src ''self''; script-src ''self'' ''unsafe-inline'' ''unsafe-eval''; style-src ''self'' ''unsafe-inline'';' always;

    # Disable framing by external sites (prevents being in external iframes)
    # [opt-in] more_set_headers 'Frame-Options: DENY' always;

    # --- ModSecurity - Web Application Firewall (Модуль ModSecurity - WAF) ---
    # Repeat: Can also enable globally (applies to all vhosts)
    # Or enable per-vhost for specific applications (recommended approach)
    # See above for full description and requirements
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # --- HTTP/3 / QUIC Example (Пример HTTP/3 / QUIC) ---
    # For enabling HTTP/3 support in your SSL vhosts (requires HTTP3=y):
    # Для включения поддержки HTTP/3 в ваших SSL vhosts (требует HTTP3=y):
    #
    # Add to each SSL server block:
    #   listen 443 quic reuseport;                     # UDP port 443 for QUIC
    #   listen [::]:443 quic reuseport ipv6only=on;   # IPv6 QUIC support
    #   add_header alt-svc 'h3=":443"; ma=86400' always;  # Tell browsers about HTTP/3
    #
    # Notes:
    #   - reuseport: allow multiple processes to listen on same port (load distribution)
    #   - alt-svc: HTTP header advertising HTTP/3 availability
    #   - ma=86400: browser should try HTTP/3 for 24 hours

    # --- Rate Limiting Examples (Примеры Rate Limiting) ---
    # Pre-defined rate limiting zones are configured in the http block above:
    #   - general:10m rate=10r/s burst=20 nodelay      # General API: 10 req/s
    #   - login:10m rate=5r/m burst=5 nodelay          # Login forms: 5 req/min (brute-force)
    #   - bot:10m rate=1r/s burst=1 nodelay            # Bot protection: 1 req/s
    #   - connections:10m limit_conn connections 50    # Max 50 connections per IP
    #
    # Usage in your vhosts/location blocks:
    #   limit_req zone=general burst=20 nodelay;       # Apply general rate limit
    #   limit_req zone=login burst=3 nodelay;          # Apply strict login limit
    #   limit_req zone=bot nodelay;                    # Apply bot protection
    #   limit_conn connections 50;                     # Connection limit (already global)

    # --- Config File Includes (Включение файлов конфигурации) ---
    # Additional per-domain configuration files — add vhosts in /etc/nginx/sites-enabled/
    # Дополнительные файлы конфигурации по доменам — добавьте vhosts в /etc/nginx/sites-enabled/
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}

