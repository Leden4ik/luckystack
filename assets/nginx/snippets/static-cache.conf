# --- Static Files Caching and Optimization (Кэширование Статических Файлов)
# Optimal caching strategy for different file types served by nginx
# Оптимальная стратегия кэширования различных типов файлов
# Include this snippet in your server blocks:
# Включите этот файл в ваши server блоки:
#   server {
#       include snippets/static-cache.conf;
#   }
#
# Benefits: Reduces bandwidth, speeds up page loads, improves SEO
# Преимущества: Экономит трафик, быстрее загружает страницы, улучшает SEO

# --- Images (Изображения) ---
# Long-term caching with Content Negotiation for modern image formats
# Долгосрочное кэширование с Content Negotiation для современных форматов
# Includes: jpg, png, gif, ico, webp (modern), avif (new), heic/heif (Apple)
# "immutable" flag tells browsers this version will never change (perfect for versioned assets)
# Флаг "immutable" говорит браузерам что эта версия не изменится (идеально для versioned assets)
# Vary: Accept header ensures CDN caches separate versions for webp vs jpeg
# Header Vary: Accept обеспечивает CDN кэширует отдельные версии для webp vs jpeg
location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|heic|heif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    add_header Vary "Accept" always;  # Important for Accept: image/webp negotiation
    access_log off;
    log_not_found off;
}

# --- Fonts (Шрифты) ---
# Long-term caching, with CORS headers (fonts required for cross-origin access)
# Долгосрочное кэширование с CORS заголовками (требуется для кроссдоменного доступа)
# Formats: woff/woff2 (modern), ttf/otf (traditional), eot (legacy IE)
# Vary: Accept-Encoding ensures gzip/brotli/uncompressed versions cached separately
location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    add_header Access-Control-Allow-Origin "*" always;  # Allow cross-origin font loading
    add_header Vary "Accept-Encoding" always;  # Cache brotli/gzip separately
    access_log off;
    log_not_found off;
}

# --- CSS and JavaScript (CSS и JavaScript) ---
# 1-year caching for versioned assets (e.g., app.v123.css, bundle.v456.js)
# Кэширование на 1 год для versioned assets (например app.v123.css, bundle.v456.js)
# Browser revalidates via ETag/Last-Modified on first page load
# Браузер переповторяет через ETag/Last-Modified при первой загрузке страницы
# Vary: Accept-Encoding ensures brotli/gzip versions cached separately
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header Vary "Accept-Encoding" always;  # Cache brotli/gzip separately
    access_log off;
    log_not_found off;
}

# --- HTML (HTML) ---
# NEVER cache HTML — always fetch from origin for fresh content
# НИКОГДА не кэшируйте HTML — всегда получайте свежий контент с сервера
# Browsers MUST revalidate every time: uses ETag/Last-Modified for 304 responses
# Браузеры ДОЛЖНЫ переповторять каждый раз: использует ETag/Last-Modified для 304
# This ensures users always see the latest version (CSS/JS updates included)
# Это обеспечивает пользователи всегда видят последнюю версию (обновления CSS/JS включены)
location ~* \.html?$ {
    expires -1;  # -1 means "in the past", forces revalidation
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;  # Legacy HTTP/1.0 compatibility
    add_header Vary "Accept-Encoding" always;
}

# --- JSON and XML (JSON и XML) ---
# Short-term caching (1 hour) for API responses and data files
# Краткосрочное кэширование (1 час) для API ответов и файлов данных
# Expires after 1 hour to prevent serving stale data
# Истекает после 1 часа чтобы избежать старых данных
location ~* \.(json|xml)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;  # 3600 sec = 1 hour
    add_header Vary "Accept-Encoding" always;
}

# --- Media Files (Медиафайлы) ---
# Streaming-friendly: sendfile + tcp_nopush optimize video/audio delivery
# Оптимизировано для потокового вещания: sendfile + tcp_nopush для видео/аудио
# sendfile_max_chunk 1m: send 1MB chunks (prevents blocking on large files)
# sendfile_max_chunk 1m: отправляет 1MB порциями (предотвращает блокировку больших файлов)
# Formats: mp4, webm (modern), ogv (legacy), mp3, m4a, aac, opus
location ~* \.(mp4|webm|ogv|mp3|m4a|aac|opus)$ {
    expires 1y;
    add_header Cache-Control "public, immutable, max-age=31536000" always;
    sendfile on;
    sendfile_max_chunk 1m;  # 1MB chunks for streaming efficiency
    tcp_nopush on;          # Group packets before sending (efficiency)
    access_log off;
    log_not_found off;
}

# --- Documents (Документы) ---
# Moderate caching (1 month) for downloadable files
# Умеренное кэширование (1 месяц) для загружаемых файлов
# PDF, Word, Excel, PowerPoint: relatively static, safe to cache
# PDF, Word, Excel, PowerPoint: относительно статичны, безопасно кэшировать
location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx)$ {
    expires 1M;  # 1 month = ~2.6M seconds
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    log_not_found off;
}

# --- Archives (Архивы) ---
# Moderate caching (1 month) for downloadable archives
# Умеренное кэширование (1 месяц) для загружаемых архивов
# Formats: zip, gz, tar, bz2, 7z, rar, exe, msi (installers)
location ~* \.(zip|gz|tar|bz2|7z|rar|exe|msi)$ {
    expires 1M;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
    log_not_found off;
}

# --- Manifests and Cache Files (Манифесты и файлы кэша) ---
# NEVER cache — manifests tell browser to fetch fresh resources
# НИКОГДА не кэшируйте — манифесты говорят браузеру получить свежие ресурсы
# If old manifest is cached, browser won't know about new resources
# Если старый манифест кэширован, браузер не узнает о новых ресурсах
location ~* \.(manifest|appcache|webapp|webmanifest)$ {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
}

# --- Disable Logging for Common Requests (Отключить логирование для обычных запросов) ---
# favicon.ico and robots.txt are requested by every browser/bot
# favicon.ico и robots.txt запрашиваются каждым браузером/ботом
# Reducing log spam improves log readability and reduces I/O
# Меньше логов = лучше читаемость и меньше I/O операций
location = /favicon.ico {
    access_log off;  # Don't log this popular request
    log_not_found off;  # Don't log 404 if favicon doesn't exist
}

location = /robots.txt {
    access_log off;
    log_not_found off;
}
