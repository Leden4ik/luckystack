# --- HTTP Security Headers Configuration (Конфигурация заголовков безопасности HTTP) ---
# Comprehensive set of HTTP headers to prevent common web vulnerabilities
# Полный набор HTTP заголовков для предотвращения распространенных уязвимостей
#
# Include this snippet in your SSL vhosts where needed:
# Включите этот файл в ваши SSL vhosts где необходимо:
#   server {
#       listen 443 ssl http2;
#       include snippets/security-headers.conf;
#   }
#
# IMPORTANT: Requires headers-more-nginx-module compiled (HEADERMOD=y)
# ВАЖНО: Требует headers-more-nginx-module скомпилирован (HEADERMOD=y)
#
# Test your headers at: https://securityheaders.com
# Тестируйте ваши заголовки на: https://securityheaders.com

# --- Remove Server Identification (Удалить идентификацию сервера) ---
# Security through obscurity: Don't advertise nginx/PHP version
# Безопасность через скрытие: Не рекламируйте версию nginx/PHP
# Attackers commonly use version numbers to target specific CVEs
# Злоумышленники используют номера версий для атак на конкретные CVE
#
# more_clear_headers 'X-Powered-By' 'Server' 'X-AspNet-Version' 'X-Runtime-Version';

# --- X-Content-Type-Options: nosniff (Предотвращение MIME снифинга) ---
# Prevents browser from guessing MIME type (e.g., executing CSS as script)
# Предотвращает браузер угадывать MIME тип (например выполнение CSS как скрипт)
# Critical for security: protects against malicious file uploads
# Критично для безопасности: защищает от вредоносных загрузок файлов
# Example attack prevented:
#   - Upload file as "image.jpg" but serve as "image.jpg" with text/javascript MIME
#   - Without this header: browser executes JavaScript
#   - With this header: browser enforces Content-Type (safe)
#
# more_set_headers 'X-Content-Type-Options: nosniff' always;

# --- X-Frame-Options: SAMEORIGIN (Защита от Clickjacking) ---
# Prevent page from being framed on external websites
# Предотвращать встраивание страницы в iframe внешних сайтов
# Stops clickjacking attacks where attacker tricks user into clicking invisible buttons
# Останавливает clickjacking атаки где злоумышленник заставляет кликнуть невидимые кнопки
# Options:
#   DENY — don't frame anywhere
#   SAMEORIGIN — allow framing only from same domain
#   ALLOW-FROM https://trusted.example.com — allow specific origin
#
# more_set_headers 'X-Frame-Options: SAMEORIGIN' always;

# --- X-XSS-Protection и Expect-CT: НЕ использовать ---
# Браузеры их больше не поддерживают; X-XSS-Protection в старых браузерах сам давал утечку
# данных (XS-Leak). Защиту от XSS даёт Content-Security-Policy.

# --- Referrer-Policy: strict-origin-when-cross-origin (Политика реферера) ---
# Controls how much HTTP Referer information is sent in requests
# Контролирует сколько информации HTTP Referer отправляется в запросах
# Privacy protection: don't leak full URL to external sites
# Защита приватности: не протекать полный URL внешним сайтам
#
# Modes:
#   no-referrer — never send referer (maximum privacy)
#   strict-origin-when-cross-origin — send only origin for cross-site
#   same-origin — only send referer within same domain
#
# more_set_headers 'Referrer-Policy: strict-origin-when-cross-origin' always;

# --- Permissions-Policy (Feature-Policy) - API Restrictions (Ограничение API) ---
# Block dangerous browser APIs that websites might abuse
# Блокировать опасные API браузера которые вебсайты могут использовать во вред
# Prevents: camera access, geolocation tracking, microphone use, payment handler registration
# Предотвращает: доступ к камере, отслеживание геолокации, использование микрофона
# Especially important if your site is embedded in iframes
# Особенно важно если ваш сайт встраивается в iframes
#
# Restricted APIs: accelerometer, camera, geolocation, microphone, payment, usb, etc.
# () = disabled everywhere
# (self) = only from same origin
#
# more_set_headers 'Permissions-Policy: accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=(), usb=(self)' always;


# --- Strict-Transport-Security (HSTS) - HTTPS Enforcement ⚠️ WARNING ⚠️
# Force HTTPS on all connections, preload into browser's HSTS list
# Заставить HTTPS на всех соединениях, предзагрузить в HSTS список браузера
#
# ⚠️ CRITICAL: Only enable AFTER testing HTTPS works perfectly!
# ⚠️ КРИТИЧНО: Включайте только ПОСЛЕ тестирования что HTTPS работает!
#
# Consequences of wrong SSL cert with HSTS enabled:
#   - Browser refuses connection for ENTIRE domain + subdomains
#   - Locked out for 1 YEAR (max-age=31536000)
#   - Users can only bypass by: browser reset, different browser, or waiting 1 year
#
# Consequences неправильного SSL сертификата с включенным HSTS:
#   - Браузер отказывает соединение для ВСЕГО домена + поддомены
#   - Заблокирован на 1 ГОД (max-age=31536000)
#   - Пользователи могут обойти только: сброс браузера, другой браузер или ожидание 1 года
#
# Recommended progression:
#   1. Testing phase: max-age=300 (5 minutes)
#   2. Staging phase: max-age=3600 (1 hour)
#   3. Production: max-age=31536000 (1 year) after weeks of testing
#   4. Preload: register at https://hstspreload.org after 1 month stable
#
# max-age=31536000 — enforce for 1 year
# includeSubDomains — apply to all subdomains
# preload — allow inclusion in browser's preload list
#
# more_set_headers 'Strict-Transport-Security: max-age=31536000; includeSubDomains; preload' always;

# --- Content-Security-Policy (CSP) - Prevent Inline Scripts (Политика безопасности контента) ---
# ❌ DO NOT USE GLOBAL RESTRICTIVE CSP!
# ❌ НЕ ИСПОЛЬЗУЙТЕ ГЛОБАЛЬНУЮ СТРОГУЮ CSP!
#
# CSP is application-specific. Using overly restrictive global CSP will:
#   - Break third-party scripts and analytics
#   - Cause maintenance nightmares when changing analytics providers
#   - Require constant exceptions and whitelisting
#
# ✅ INSTEAD: Each application should customize its own CSP
# ✅ ВМЕСТО: Каждое приложение должно иметь собственную CSP
#
# Recommended approach:
#   1. For testing: use Content-Security-Policy-Report-Only header
#   2. For production: use application-specific CSP in each server block
#   3. Monitor reports at: https://report.example.com/csp-report (CSP Report endpoint)
#
# --- CSP Examples (Примеры CSP) ---
#
# Example 1: Very Restrictive (for internal apps without third-party)
# Очень строгая (для внутренних приложений без third-party)
#   more_set_headers 'Content-Security-Policy: default-src ''self''; img-src ''self'' data: https:; font-src ''self''; script-src ''self''; style-src ''self'';' always;
#
# Example 2: With CDN (for static assets)
# С CDN (для статических ассетов)
#   more_set_headers 'Content-Security-Policy: default-src ''self''; script-src ''self'' cdn.trusted.com; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: https: cdn.trusted.com;' always;
#
# Example 3: For WordPress (allow more inline styles)
# Для WordPress (разрешить больше inline стилей)
#   more_set_headers 'Content-Security-Policy: default-src ''self''; script-src ''self'' ''unsafe-inline'' ''unsafe-eval''; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: https:;' always;
#
# Example 4: For modern web apps (single-page applications)
# Для современных веб-приложений (single-page applications)
#   more_set_headers 'Content-Security-Policy: default-src ''self''; script-src ''self''; style-src ''self'' ''unsafe-inline''; img-src ''self'' data: https:; font-src ''self'' data:; connect-src ''self''; frame-ancestors ''none''; base-uri ''self''; form-action ''self'';' always;

# --- Frame-Options: DENY (Prevent External Framing) ---
# Stricter alternative to X-Frame-Options: DENY
# Более строгая альтернатива к X-Frame-Options: DENY
# Prevents ANY external framing (not just same-origin)
# Предотвращает ЛЮБОЕ внешнее встраивание (не только same-origin)
#
# more_set_headers 'Frame-Options: DENY' always;

# --- Additional Recommended Headers (Дополнительные рекомендуемые заголовки) ---
#
# DNS Prefetch Control (prevent DNS lookups for external resources)
# more_set_headers 'X-DNS-Prefetch-Control: off' always;
#
# Prevent FLoC Conversion (opt-out of Google's Federated Learning of Cohorts)
# more_set_headers 'Permissions-Policy: interest-cohort=()' always;
#
# Control user agent access to features
# more_set_headers 'X-UA-Compatible: IE=edge' always;

# --- Testing & Debugging (Тестирование и отладка) ---
# 1. Test headers online: https://securityheaders.com
#    Тестируйте заголовки онлайн: https://securityheaders.com
#
# 2. View headers in browser DevTools (F12 → Network → Response Headers)
#    Смотрите заголовки в DevTools браузера (F12 → Network → Response Headers)
#
# 3. Use curl to check headers:
#    curl -I https://your-domain.com
#
# 4. Monitor CSP violations (if using Content-Security-Policy-Report-Only):
#    tail -f /var/log/nginx/csp_reports.log
#
# 5. Start with Report-Only mode before enforcing:
#    more_set_headers 'Content-Security-Policy-Report-Only: ...' always;
