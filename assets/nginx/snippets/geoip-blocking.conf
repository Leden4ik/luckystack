# =============================================================================
# GeoIP2 Country Blocking (Блокировка по стране через GeoIP2)
# =============================================================================
# Requires: GEOIP=y compiled + GeoLite2 databases in /opt/geoip/
# Требует: GEOIP=y при компиляции + БД GeoLite2 в /opt/geoip/
#
# ARCHITECTURE — two-step setup (Архитектура — два шага):
#
#   Step 1: Add map block to nginx.conf (http context) or conf.d/geoip-maps.conf
#           Шаг 1: Добавьте map блок в nginx.conf (http контекст) или conf.d/geoip-maps.conf
#
#   Step 2: Include this snippet in your server block + add if/return check
#           Шаг 2: Включите этот сниппет в server блок + добавьте if/return проверку
#
# WHY map must be in http context: map is evaluated once per request at http level.
# Putting it inside server {} causes nginx config error: unknown directive.
# ПОЧЕМУ map должен быть в http: map вычисляется на уровне http один раз.
# Внутри server {} вызовет ошибку nginx: unknown directive.
# =============================================================================


# =============================================================================
# STEP 1 — Add to nginx.conf http block or /etc/nginx/conf.d/geoip-maps.conf
# ШАГ 1 — Добавьте в nginx.conf http блок или /etc/nginx/conf.d/geoip-maps.conf
# =============================================================================

# --- BLACKLIST: Block specific countries (ЧЁРНЫЙ СПИСОК: блокировать страны) ---
# Deny access from specific countries. All others allowed by default.
# Запретить доступ из конкретных стран. Все остальные разрешены по умолчанию.
#
# Uncomment and add to nginx.conf http block:
# Раскомментируйте и добавьте в http блок nginx.conf:
#
# map $geoip2_data_country_code $blocked_country {
#     default          0;   # allow everyone else / разрешить всех остальных
#     CN               1;   # China / Китай
#     KP               1;   # North Korea / Северная Корея
#     IR               1;   # Iran / Иран
#     # Add more country codes as needed:
#     # RU 1;   # Russia
#     # SY 1;   # Syria
#     # BY 1;   # Belarus
#     # VN 1;   # Vietnam
# }


# --- WHITELIST: Allow only specific countries (БЕЛЫЙ СПИСОК: только эти страны) ---
# All countries blocked EXCEPT those listed. More restrictive approach.
# Все страны заблокированы КРОМЕ перечисленных. Более строгий подход.
#
# Uncomment and add to nginx.conf http block:
# Раскомментируйте и добавьте в http блок nginx.conf:
#
# map $geoip2_data_country_code $allowed_country {
#     default          0;   # block everyone else / заблокировать всех остальных
#     RU               1;   # Russia / Россия
#     BY               1;   # Belarus / Беларусь
#     UA               1;   # Ukraine / Украина
#     KZ               1;   # Kazakhstan / Казахстан
#     # Add more as needed:
#     # US 1; GB 1; DE 1; FR 1;
# }


# =============================================================================
# STEP 2 — This snippet goes inside your server {} block
# ШАГ 2 — Этот сниппет идёт внутрь вашего server {} блока
# =============================================================================
# Include in vhost:
#   include snippets/geoip-blocking.conf;
#
# Then AFTER the include, add your blocking logic (see examples below).
# Затем ПОСЛЕ include добавьте вашу логику блокировки (примеры ниже).


# =============================================================================
# USAGE EXAMPLES — paste inside server {} block (after include)
# ПРИМЕРЫ ИСПОЛЬЗОВАНИЯ — вставьте внутрь server {} блока (после include)
# =============================================================================

# --- Example 1: Block China (Пример 1: Блокировать Китай) ---
# Requires blacklist map above with CN 1
# Требует blacklist map выше с CN 1
#
# if ($blocked_country) {
#     return 403 "Access from your region is not allowed.";
# }


# --- Example 2: Block China, return proper 444 (drop connection) ---
# 444 — nginx-specific: closes connection without response (saves bandwidth)
# 444 — специфично nginx: закрывает соединение без ответа (экономит трафик)
# More aggressive — use for known abusive regions.
# Более агрессивно — используйте для регионов с высоким уровнем злоупотреблений.
#
# if ($blocked_country) {
#     return 444;
# }


# --- Example 3: Whitelist — allow only specific countries ---
# Requires whitelist map above. All others get 403.
# Требует whitelist map выше. Все остальные получают 403.
#
# if ($allowed_country = 0) {
#     return 403 "Service not available in your region.";
# }


# --- Example 4: Block country but allow specific IPs (whitelist override) ---
# Useful when you need to block a country but keep access for known IPs.
# Полезно когда нужно заблокировать страну но оставить доступ для известных IP.
#
# In nginx.conf http block add:
# geo $whitelist_ip {
#     default          0;
#     1.2.3.4          1;   # trusted IP / доверенный IP
#     10.0.0.0/8       1;   # internal network / внутренняя сеть
# }
# map $geoip2_data_country_code $final_block {
#     default          0;
#     CN               1;
# }
# map "$whitelist_ip:$final_block" $should_block {
#     default          0;
#     "0:1"            1;   # not whitelisted AND blocked country
# }
#
# In server block:
# if ($should_block) {
#     return 403;
# }


# --- Example 5: Block country on specific paths only ---
# Block China only for admin area, allow for public content.
# Блокировать Китай только для admin, разрешить для публичного контента.
#
# location /admin {
#     if ($blocked_country) {
#         return 403;
#     }
#     # ... rest of admin config
# }


# --- Example 6: Log blocked requests separately (for analysis) ---
# Useful to monitor what you're blocking before enforcing.
# Полезно для мониторинга что блокируется перед включением.
#
# access_log /var/log/nginx/geo_blocked.log geoip if=$blocked_country;
# if ($blocked_country) {
#     return 403;
# }


# =============================================================================
# Country Code Reference / Справочник кодов стран (ISO 3166-1 alpha-2)
# =============================================================================
# CN — China / Китай              TW — Taiwan / Тайвань
# RU — Russia / Россия            BY — Belarus / Беларусь
# KP — North Korea / С. Корея     IR — Iran / Иран
# SY — Syria / Сирия              VN — Vietnam / Вьетнам
# UA — Ukraine / Украина          KZ — Kazakhstan / Казахстан
# US — United States / США        GB — United Kingdom / Великобритания
# DE — Germany / Германия         FR — France / Франция
# JP — Japan / Япония             BR — Brazil / Бразилия
# IN — India / Индия              AU — Australia / Австралия
#
# Full list: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
# Check your IP country: https://www.maxmind.com/en/geoip-demo
# =============================================================================


# =============================================================================
# NOTES (Примечания)
# =============================================================================
# 1. GeoIP2 identifies country by IP. VPNs bypass geo-blocking.
#    GeoIP2 определяет страну по IP. VPN обходит geo-блокировку.
#    For stronger blocking: combine with fail2ban or firewall rules (iptables/nftables).
#
# 2. GeoIP2 lookups: ~1-2 microseconds per request (negligible overhead).
#    GeoIP2 поиск: ~1-2 микросекунды на запрос (незначительная нагрузка).
#
# 3. Behind Cloudflare or other CDN: $remote_addr is CDN's IP, not visitor's.
#    За Cloudflare: $remote_addr — IP CDN, не посетителя.
#    Fix: use $http_cf_connecting_ip instead (requires set_real_ip_from in nginx.conf).
#    Решение: используйте $http_cf_connecting_ip (требует set_real_ip_from в nginx.conf).
#
# 4. GeoLite2 databases auto-update via the geoipupdate systemd timer (Wed+Sat).
#    Manual run: geoipupdate ; status: systemctl status geoipupdate.timer
#    Базы обновляются автоматически через geoipupdate.timer (Ср+Сб).
#    Вручную: geoipupdate ; статус: systemctl status geoipupdate.timer
