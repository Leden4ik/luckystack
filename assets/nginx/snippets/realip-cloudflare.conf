# =============================================================================
# Real client IP behind Cloudflare / Реальный IP клиента за Cloudflare
# =============================================================================
# Restores the visitor's real IP when traffic is proxied through Cloudflare.
# Without this, $remote_addr is a Cloudflare edge IP — logs, rate-limits and
# CrowdSec would all act on the proxy address instead of the real client.
#
# Восстанавливает реальный IP посетителя, когда трафик идёт через Cloudflare.
# Без этого $remote_addr — это IP узла Cloudflare, и логи, rate-limit и CrowdSec
# работали бы по адресу прокси, а не реального клиента.
#
# Include in the http{} block of nginx.conf:
#   include /etc/nginx/snippets/realip-cloudflare.conf;
#
# SAFE to keep always: set_real_ip_from is a trust anchor — the CF-Connecting-IP
# header is honored ONLY for connections originating from the ranges below, so a
# client NOT behind Cloudflare cannot spoof its IP. If you don't use Cloudflare,
# these ranges simply never match and the snippet has no effect.
#
# NOTE: this is a STATIC baseline. The installer regenerates it with live ranges
# from https://www.cloudflare.com/ips-v4 and /ips-v6. Refresh manually with:
#   { curl -fsS https://www.cloudflare.com/ips-v4; curl -fsS https://www.cloudflare.com/ips-v6; } \
#     | sed 's/^/set_real_ip_from /; s/$/;/' > /tmp/cf && \
#     printf 'real_ip_header CF-Connecting-IP;\nreal_ip_recursive on;\n' >> /tmp/cf && \
#     mv /tmp/cf /etc/nginx/snippets/realip-cloudflare.conf && nginx -t && systemctl reload nginx
# =============================================================================

# --- Cloudflare IPv4 ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# --- Cloudflare IPv6 ---
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use Cloudflare's header carrying the original client IP.
# Если перед Cloudflare есть ещё один прокси, переключите на X-Forwarded-For.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
