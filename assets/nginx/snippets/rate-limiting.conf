# --- Rate Limiting and DDoS Protection (Rate Limiting и защита от DDoS) ---
# Practical examples for applying rate limiting zones to protect your applications
# Практические примеры применения rate limiting zones для защиты приложений
#
# Include these examples in your server blocks:
# Включите эти примеры в ваши server блоки:
#   server {
#       include snippets/rate-limiting.conf;
#   }
#
# Zones defined in conf/nginx.conf:
#   - general:10m rate=10r/s burst=20 nodelay    # 10 requests/sec with burst
#   - login:10m rate=5r/m burst=5 nodelay        # 5 requests/min (brute-force protection)
#   - bot:10m rate=1r/s burst=1 nodelay          # 1 request/sec (crawler/scraper limit)
#   - connections:10m limit_conn connections 50  # Max 50 connections per IP

# --- Example 1: Protect Login Forms (Защита форм логина) ---
# Very strict rate limiting to prevent brute-force attacks
# Очень строгое ограничение для предотвращения brute-force атак
# Blocks: admin pages, WordPress login, user login areas
# Блокирует: админ страницы, WordPress логин, области логина пользователей
# Allows: Only 3 requests per minute per IP address
# Позволяет: Только 3 запроса в минуту с одного IP
location ~ ^/(admin|wp-admin|user).*login {
    limit_req zone=login burst=3 nodelay;
    limit_conn connections 10;  # Also limit concurrent connections
    # Forward to your backend after rate limit check passes
    proxy_pass http://backend;
}

# --- Example 2: Protect API Endpoints (Защита API endpoints) ---
# Moderate rate limiting for normal API operations
# Умеренное ограничение для нормальных API операций
# Allows: 10 requests/sec (general) with 50-request burst buffer
# Позволяет: 10 запросов/сек (general) с буфером 50 запросов
# Use case: REST APIs, GraphQL, JSON endpoints
# Использование: REST APIs, GraphQL, JSON endpoints
location /api/ {
    limit_req zone=general burst=50 nodelay;
    limit_conn connections 100;  # More generous for API clients
    proxy_pass http://backend;
}

# --- Example 3: Protect File Upload Endpoints (Защита endpoints загрузки файлов) ---
# Moderate rate limiting for upload operations (fewer but larger requests)
# Умеренное ограничение для загрузки файлов (меньше но больше запросов)
# Allows: General rate limit with 10-request burst
# Позволяет: General rate limit с буфером 10 запросов
# Also sets large file size limit for uploads
# Также устанавливает большой лимит размера файла для загрузок
location /upload {
    limit_req zone=general burst=10 nodelay;
    client_max_body_size 100m;  # Allow 100MB file uploads
    proxy_pass http://backend;
}

# --- Example 4: Block Common Attack Paths (Блокировать обычные пути атак) ---
# Deny requests for known attack vectors and malicious paths
# Отклонить запросы на известные векторы атак и вредоносные пути
# Blocks: WordPress login, PHP config files, shell scripts, ASP files
# Блокирует: WordPress логин, PHP конфиг файлы, shell скрипты, ASP файлы
# Log blocked requests to separate file for security monitoring
# Логируем блокированные запросы в отдельный файл для мониторинга безопасности
# Recommendation: Monitor /var/log/nginx/blocked_attacks.log and set up alerts
# Рекомендация: Мониторьте /var/log/nginx/blocked_attacks.log и устанавливайте алерты
location ~ /(wp-login|admin\.php|config\.php|shell\.php|webshell\.php|backdoor\.|\.asp|\.aspx) {
    access_log /var/log/nginx/blocked_attacks.log;
    return 403;  # Forbidden response
}

# --- Example 5: Rate Limit Content Scrapers (Ограничить content scraper) ---
# Detect and throttle bots trying to scrape JSON/XML/text content
# Обнаружить и дросселировать ботов пытающихся скрепить контент
# Also prevents automated file downloads and data exfiltration
# Также предотвращает автоматизированное скачивание файлов и утечку данных
# Uses bot zone: 1 request per second maximum
# Использует bot zone: 1 запрос в секунду максимум
location ~ \.(txt|xml|json)$ {
    limit_req zone=bot nodelay;
}

# --- Example 6: Rate Limit Search Engines (Ограничить поисковые движки) ---
# More granular control: throttle specific crawlers (optional)
# Более точный контроль: дросселировать конкретных crawlers (опционально)
# Useful when you don't want search bots crawling too aggressively
# Полезно когда вы не хотите чтобы поисковые боты слишком агрессивно кроулили
#
# Uncomment and customize based on your needs:
# Раскомментируйте и настройте по вашим потребностям:
#
# map $http_user_agent $is_bot {
#     default 0;
#     "~*Googlebot" 1;        # Google
#     "~*Bingbot" 1;          # Microsoft Bing
#     "~*Yandexbot" 1;        # Yandex (Russian search)
#     "~*Slurp" 1;            # Yahoo
#     "~*DuckDuckGo" 1;       # DuckDuckGo
# }
#
# Then use in a location block:
# location / {
#     if ($is_bot) {
#         limit_req zone=general burst=5 nodelay;
#     }
# }

# --- Example 7: Robots.txt Rate Limiting (Rate limiting robots.txt) ---
# Rate limit search engines accessing robots.txt (prevents parser spam)
# Ограничить поисковые движки при доступе к robots.txt (предотвращает спам parser)
# Allows 5 requests per second (more than general limit since bots cluster requests)
# Позволяет 5 запросов в секунду (больше чем general так как боты кластеризуют запросы)
#
# Uncomment to enable:
# location = /robots.txt {
#     limit_req zone=general burst=5 nodelay;
#     access_log off;  # Don't log robots.txt requests (spammy)
# }

# --- Security Notes (Примечания безопасности) ---
# 1. nodelay = immediately reject excess requests (don't buffer)
#    Мгновенно отклонять превышающие лимит запросы (не буферировать)
#
# 2. burst = temporary buffer for traffic spikes
#    Временный буфер для всплесков трафика
#
# 3. Connection limits prevent resource exhaustion from single IP
#    Ограничение соединений предотвращают истощение ресурсов с одного IP
#
# 4. For legitimate users experiencing rate limits:
#    Для легитимных пользователей испытывающих ограничения:
#    - Implement exponential backoff (wait longer between retries)
#    - Implement exponential backoff (ждите дольше между повторами)
#    - Consider whitelisting trusted IPs in limit_req_status 200 blocks
#
# 5. Monitor rate limit triggers via nginx error log:
#    Мониторьте triggers rate limits через nginx error log:
#    tail -f /var/log/nginx/error.log | grep "limiting requests"
