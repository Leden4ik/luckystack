# GeoIP.conf — configuration for geoipupdate tool
# Placeholders are substituted automatically by the installer:
#   YOUR_ACCOUNT_ID_HERE  → GEOIP2_ACCOUNT_ID
#   YOUR_LICENSE_KEY_HERE → GEOIP2_LICENSE_KEY

AccountID YOUR_ACCOUNT_ID_HERE
LicenseKey YOUR_LICENSE_KEY_HERE
EditionIDs GeoLite2-ASN GeoLite2-City GeoLite2-Country
