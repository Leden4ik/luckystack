# =============================================================================
# Ограничение доступа к панели ISPConfig (:3333) по IP
# =============================================================================
# Панель торчит наружу — лучше пускать только с доверенных админ-адресов.
# Два способа (выберите ОДИН; firewall-вариант надёжнее).
#
# --- Способ A (рекомендуется): UFW, не трогая nginx ---
#   sudo ufw allow from <ВАШ_АДМИН_IP> to any port 3333 proto tcp
#   sudo ufw allow from <ВАШ_АДМИН_IP> to any port 3333 proto udp   # для HTTP/3
#   sudo ufw deny 3333
#
# --- Способ B: прямо в nginx, в server{} панели ---
#   Файл: /etc/nginx/sites-available/ispconfig.vhost
#   Вставьте блок ниже СРАЗУ после "server_name _;" в server-блоке :3333.
#   ⚠️ Файл панели перегенерируется при обновлении ISPConfig — после апдейта повторить.
# =============================================================================

        # --- IP allowlist для панели / panel allowlist ---
		allow 127.0.0.1;
        allow <ВАШ_АДМИН_IP>;       # ваш админ-IP / your admin IP
        # allow <ВТОРОЙ_АДМИН_IP>;  # ещё один админ-IP / second admin IP
        # allow 10.0.0.0/8;         # внутренняя сеть / internal net
        deny all;

# После правки nginx:  nginx -t && systemctl reload nginx
# Проверка: с чужого IP панель должна отдавать 403, с вашего — открываться.
