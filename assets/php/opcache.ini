; =============================================================================
; PHP OPcache + JIT — заметный прирост для WordPress/CMS (PHP 8.x)
; =============================================================================
; Куда класть / Where to put:
;   • Глобально для пула FPM:  /etc/php/<ver>/fpm/conf.d/99-opcache-jit.ini
;     (затем: systemctl reload php<ver>-fpm)
;   • Или per-site в панели ISPConfig:
;     Sites → (домен) → Options → "Custom php.ini settings" (без секции [opcache])
;
; JIT включается только при opcache.jit_buffer_size > 0. tracing — безопасный режим.
; Если какое-то приложение странно себя ведёт с JIT — поставьте opcache.jit=off.
;
; Если включён этап авто-тюнинга, memory_consumption, interned_strings_buffer и
; max_accelerated_files перекрывает 99-zz-luckystack-tuning.ini (он грузится позже и
; считает размер кэша по объёму RAM). Править тогда надо его, а не этот файл.
; =============================================================================

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256          ; МБ под кэш опкода (поднимите для многих сайтов)
opcache.interned_strings_buffer=32      ; МБ под интернированные строки
opcache.max_accelerated_files=20000     ; число кэшируемых файлов (WordPress большой)
opcache.max_wasted_percentage=10
opcache.validate_timestamps=1           ; 1 = подхватывать изменения файлов
opcache.revalidate_freq=2               ; раз в сколько секунд проверять (prod можно 60)
opcache.save_comments=1                 ; нужно некоторым фреймворкам (аннотации)
opcache.fast_shutdown=1

; --- JIT (PHP 8.0+) ---
opcache.jit=tracing                     ; tracing | function | off
opcache.jit_buffer_size=128M
