; =============================================================================
; PHP: безопасные значения по умолчанию для всех сайтов (FPM и CLI)
; Кладётся в /etc/php/<ver>/{fpm,cli}/conf.d/98-luckystack-security.ini
; Любое значение можно переопределить для сайта в ISPConfig:
;   Sites -> (домен) -> Options -> Custom php.ini settings
; =============================================================================

; не светить версию PHP в заголовке X-Powered-By
expose_php = Off

; cookie сессии недоступна из JavaScript (защита от кражи через XSS)
session.cookie_httponly = 1
; не принимать чужой, не выданный сервером ID сессии (защита от фиксации сессии)
session.use_strict_mode = 1
session.use_only_cookies = 1
; прогресс загрузки пишет данные из запроса в файл сессии, этим пользуются при
; эксплуатации LFI; сайтам он почти никогда не нужен
session.upload_progress.enabled = 0

; OPcache общий для всех пулов одной версии PHP: проверяем права на файл и корень
; chroot, чтобы сайт не мог получить закэшированный код чужого сайта
opcache.validate_permission = 1
opcache.validate_root = 1
